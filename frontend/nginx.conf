server {
    listen 80;
    
    # 1. إعدادات تشغيل React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # عشان الـ React Router يشتغل صح
    }

    # 2. توجيه الـ API للباك إند
    location /api/ {
        proxy_pass http://back-end:5002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}